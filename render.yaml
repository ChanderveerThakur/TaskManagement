services:
  # -------------------------------------------------------------
  # Backend API Service (Django REST Framework)
  # -------------------------------------------------------------
  - type: web
    name: taskmanagement-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash ./build.sh
    startCommand: gunicorn --chdir TaskManagement TaskManagement.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com,http://localhost:5173

  # -------------------------------------------------------------
  # Frontend Static Site (React + Vite)
  # -------------------------------------------------------------
  - type: web
    name: taskmanagement-frontend
    runtime: static
    rootDir: frontend/TaskManagementApp
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: taskmanagement-backend
          property: host
